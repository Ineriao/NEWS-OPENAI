# =====================================================
# 新闻发布管理系统 - Spring Boot 配置
# =====================================================

server:
  port: 8080
  address: 0.0.0.0  # 允许局域网访问

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/news_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    type: com.alibaba.druid.pool.DruidDataSource
    # Druid 连接池配置
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  type-aliases-package: com.news.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 配置
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough123456}
  expiration: 86400000

# 文件上传配置
upload:
  path: ${UPLOAD_PATH:D:/uploads/news/}
  max-size: 10485760

# AI 配置 - OpenAI 兼容格式 (支持 Kimi/DeepSeek/OpenAI)
ai:
  api-key: ${AI_API_KEY:your-api-key-here}
  base-url: ${AI_BASE_URL:https://api.moonshot.cn/v1}
  model: ${AI_MODEL:moonshot-v1-8k}

# 日志配置
logging:
  level:
    com.news: debug
