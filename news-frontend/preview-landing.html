<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新闻发布系统 - 预览</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #CBD4E5 0%, #A795BF 25%, #FEE9A1 50%, #6C5DAB 75%, #CCA2A7 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 波浪容器 */
    a-waves {
      --x: -0.5rem;
      --y: 50%;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 120px);
      overflow: hidden;
    }

    a-waves:before {
      position: absolute;
      top: 0;
      left: 0;
      width: 0.6rem;
      height: 0.6rem;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      transform: translate3d(calc(var(--x) - 50%), calc(var(--y) - 50%), 0);
      will-change: transform;
      content: "";
      z-index: 10;
      pointer-events: none;
    }

    a-waves svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    a-waves svg path {
      fill: none;
      stroke: rgba(0, 0, 0, 0.18);
      stroke-width: 1px;
    }

    /* 中央标题 */
    .hero-title {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }

    .hero-title h1 {
      font-size: 4rem;
      font-weight: 900;
      color: rgba(0, 0, 0, 0.85);
      letter-spacing: 0.5rem;
      text-transform: uppercase;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
    }

    .hero-title p {
      font-size: 1.2rem;
      color: rgba(0, 0, 0, 0.6);
      letter-spacing: 0.3rem;
    }

    /* 底部导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      max-width: 1400px;
      width: 100%;
      padding: 0 40px;
    }

    .nav-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 120px;
      text-decoration: none;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.15rem;
      text-transform: uppercase;
      position: relative;
      transition: all 0.3s ease;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-item:last-child {
      border-right: none;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FEE9A1;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, #CBD4E5, #A795BF, #FEE9A1);
      transition: width 0.3s ease;
    }

    .nav-item:hover::before {
      width: 80%;
    }

    .nav-divider {
      color: rgba(255, 255, 255, 0.3);
      font-size: 2rem;
      font-weight: 300;
      padding: 0 20px;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .hero-title h1 {
        font-size: 2rem;
        letter-spacing: 0.2rem;
      }

      .nav-item {
        font-size: 0.8rem;
        letter-spacing: 0.05rem;
      }

      .bottom-nav {
        height: 80px;
      }

      .nav-item {
        height: 80px;
      }

      a-waves {
        height: calc(100% - 80px);
      }
    }
  </style>
</head>
<body>
  <!-- 波浪背景 -->
  <a-waves>
    <svg class="js-svg"></svg>
  </a-waves>

  <!-- 中央标题 -->
  <div class="hero-title">
    <h1>新闻发布系统</h1>
    <p>News Publishing System</p>
  </div>

  <!-- 底部导航栏 -->
  <nav class="bottom-nav">
    <div class="nav-container">
      <a href="http://localhost:5173/" class="nav-item">首页</a>
      <span class="nav-divider">+</span>
      <a href="http://localhost:5173/login" class="nav-item">登录</a>
      <span class="nav-divider">+</span>
      <a href="http://localhost:5173/register" class="nav-item">注册</a>
      <span class="nav-divider">+</span>
      <a href="http://localhost:5173/admin" class="nav-item">后台管理</a>
    </div>
  </nav>

  <!-- 使用 noisejs 库 -->
  <script>
    /*
     * A speed-improved perlin and simplex noise algorithms for 2D.
     * Based on example code by Stefan Gustavson (stegu@itn.liu.se).
     */
    (function(global){
      var module = global.noise = {};

      function Grad(x, y, z) {
        this.x = x; this.y = y; this.z = z;
      }

      Grad.prototype.dot2 = function(x, y) {
        return this.x*x + this.y*y;
      };

      var grad3 = [new Grad(1,1,0),new Grad(-1,1,0),new Grad(1,-1,0),new Grad(-1,-1,0),
                   new Grad(1,0,1),new Grad(-1,0,1),new Grad(1,0,-1),new Grad(-1,0,-1),
                   new Grad(0,1,1),new Grad(0,-1,1),new Grad(0,1,-1),new Grad(0,-1,-1)];

      var p = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,
        8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,
        35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,
        134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,
        55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,
        18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,
        250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,
        189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,
        172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,
        228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,
        107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,
        138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];

      var perm = new Array(512);
      var gradP = new Array(512);

      module.seed = function(seed) {
        if(seed > 0 && seed < 1) {
          seed *= 65536;
        }

        seed = Math.floor(seed);
        if(seed < 256) {
          seed |= seed << 8;
        }

        for(var i = 0; i < 256; i++) {
          var v;
          if (i & 1) {
            v = p[i] ^ (seed & 255);
          } else {
            v = p[i] ^ ((seed>>8) & 255);
          }

          perm[i] = perm[i + 256] = v;
          gradP[i] = gradP[i + 256] = grad3[v % 12];
        }
      };

      module.seed(Math.random());

      function fade(t) {
        return t*t*t*(t*(t*6-15)+10);
      }

      function lerp(a, b, t) {
        return (1-t)*a + t*b;
      }

      module.perlin2 = function(x, y) {
        var X = Math.floor(x), Y = Math.floor(y);
        x = x - X; y = y - Y;
        X = X & 255; Y = Y & 255;

        var n00 = gradP[X+perm[Y]].dot2(x, y);
        var n01 = gradP[X+perm[Y+1]].dot2(x, y-1);
        var n10 = gradP[X+1+perm[Y]].dot2(x-1, y);
        var n11 = gradP[X+1+perm[Y+1]].dot2(x-1, y-1);

        var u = fade(x);

        return lerp(
            lerp(n00, n10, u),
            lerp(n01, n11, u),
           fade(y));
      };

    })(this);
  </script>

  <!-- 波浪动画组件 -->
  <script>
    class AWaves extends HTMLElement {
      connectedCallback() {
        this.svg = this.querySelector('.js-svg');
        this.mouse = {
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          lx: window.innerWidth / 2,
          ly: window.innerHeight / 2,
          sx: window.innerWidth / 2,
          sy: window.innerHeight / 2,
          v: 0,
          vs: 0,
          a: 0,
          set: false
        };
        this.lines = [];
        this.paths = [];

        // 初始化 noise seed
        noise.seed(Math.random());

        this.setSize();
        this.setLines();
        this.bindEvents();
        requestAnimationFrame(this.tick.bind(this));
      }

      bindEvents() {
        window.addEventListener('resize', this.onResize.bind(this));
        window.addEventListener('mousemove', this.onMouseMove.bind(this));
        window.addEventListener('touchmove', this.onTouchMove.bind(this), { passive: false });
      }

      onResize() {
        this.setSize();
        this.setLines();
      }

      onMouseMove(e) {
        this.updateMousePosition(e.clientX, e.clientY);
      }

      onTouchMove(e) {
        e.preventDefault();
        const touch = e.touches[0];
        this.updateMousePosition(touch.clientX, touch.clientY);
      }

      updateMousePosition(x, y) {
        const { mouse } = this;
        mouse.x = x - this.bounding.left;
        mouse.y = y - this.bounding.top;

        if (!mouse.set) {
          mouse.sx = mouse.x;
          mouse.sy = mouse.y;
          mouse.lx = mouse.x;
          mouse.ly = mouse.y;
          mouse.set = true;
        }
      }

      setSize() {
        this.bounding = this.getBoundingClientRect();
        this.svg.setAttribute('width', this.bounding.width);
        this.svg.setAttribute('height', this.bounding.height);
      }

      setLines() {
        const { width, height } = this.bounding;
        this.lines = [];
        this.paths.forEach(path => path.remove());
        this.paths = [];

        const xGap = 10;
        const yGap = 32;
        const oWidth = width + 200;
        const oHeight = height + 50;
        const totalLines = Math.ceil(oWidth / xGap);
        const totalPoints = Math.ceil(oHeight / yGap);
        const xStart = (width - xGap * totalLines) / 2;
        const yStart = (height - yGap * totalPoints) / 2;

        for (let i = 0; i <= totalLines; i++) {
          const points = [];
          for (let j = 0; j <= totalPoints; j++) {
            points.push({
              x: xStart + xGap * i,
              y: yStart + yGap * j,
              wave: { x: 0, y: 0 },
              cursor: { x: 0, y: 0, vx: 0, vy: 0 }
            });
          }
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          this.svg.appendChild(path);
          this.paths.push(path);
          this.lines.push(points);
        }
      }

      movePoints(time) {
        const { lines, mouse } = this;

        lines.forEach((points) => {
          points.forEach((p) => {
            // 波浪运动 - 使用 perlin noise
            const move = noise.perlin2(
              (p.x + time * 0.0125) * 0.002,
              (p.y + time * 0.005) * 0.0015
            ) * 12;

            p.wave.x = Math.cos(move) * 32;
            p.wave.y = Math.sin(move) * 16;

            // 鼠标交互效果
            const dx = p.x - mouse.sx;
            const dy = p.y - mouse.sy;
            const d = Math.hypot(dx, dy);
            const l = Math.max(200, mouse.vs * 2);

            if (d < l) {
              const s = 1 - d / l;
              const f = Math.cos(d * 0.001) * s;

              // 增强交互强度
              p.cursor.vx += Math.cos(mouse.a) * f * l * mouse.vs * 0.001;
              p.cursor.vy += Math.sin(mouse.a) * f * l * mouse.vs * 0.001;
            }

            // 弹性恢复
            p.cursor.vx += (0 - p.cursor.x) * 0.005;
            p.cursor.vy += (0 - p.cursor.y) * 0.005;

            // 摩擦力
            p.cursor.vx *= 0.92;
            p.cursor.vy *= 0.92;

            // 应用速度
            p.cursor.x += p.cursor.vx * 2.5;
            p.cursor.y += p.cursor.vy * 2.5;

            // 限制范围
            p.cursor.x = Math.min(120, Math.max(-120, p.cursor.x));
            p.cursor.y = Math.min(120, Math.max(-120, p.cursor.y));
          });
        });
      }

      moved(point, withCursorForce = true) {
        return {
          x: Math.round((point.x + point.wave.x + (withCursorForce ? point.cursor.x : 0)) * 10) / 10,
          y: Math.round((point.y + point.wave.y + (withCursorForce ? point.cursor.y : 0)) * 10) / 10
        };
      }

      drawLines() {
        const { lines, paths } = this;

        lines.forEach((points, lIndex) => {
          let d = '';

          points.forEach((point, pIndex) => {
            const isLast = pIndex === points.length - 1;
            const p = this.moved(point, !isLast);

            if (pIndex === 0) {
              d = `M ${p.x} ${p.y}`;
            } else {
              d += ` L ${p.x} ${p.y}`;
            }
          });

          paths[lIndex].setAttribute('d', d);
        });
      }

      tick(time) {
        const { mouse } = this;

        // 平滑跟随鼠标
        mouse.sx += (mouse.x - mouse.sx) * 0.1;
        mouse.sy += (mouse.y - mouse.sy) * 0.1;

        // 计算鼠标速度
        const dx = mouse.x - mouse.lx;
        const dy = mouse.y - mouse.ly;
        const d = Math.hypot(dx, dy);

        mouse.v = d;
        mouse.vs += (d - mouse.vs) * 0.1;
        mouse.vs = Math.min(100, mouse.vs);

        // 更新上一帧位置
        mouse.lx = mouse.x;
        mouse.ly = mouse.y;

        // 计算鼠标移动角度
        mouse.a = Math.atan2(dy, dx);

        // 更新 CSS 变量（光标跟随点）
        this.style.setProperty('--x', `${mouse.sx}px`);
        this.style.setProperty('--y', `${mouse.sy}px`);

        // 更新动画
        this.movePoints(time);
        this.drawLines();

        requestAnimationFrame(this.tick.bind(this));
      }
    }

    customElements.define('a-waves', AWaves);
  </script>
</body>
</html>
